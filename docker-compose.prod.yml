# Production topology for Criptotrade — TLS-terminating nginx in front of the
# API, internal-only app/orchestrator/prometheus, Let's Encrypt certs via certbot.
#
# IMPORTANT: use THIS FILE ALONE — it is NOT a `-f` overlay of docker-compose.yml.
# The dev file publishes app:8000/8501 to the host and Compose *concatenates*
# `ports` when merging files, so an overlay could not un-publish them. This file
# is a complete, locked-down stack where only nginx exposes ports (80/443).
#
#   1. cp .env.prod.example .env        # then set API_KEYS to a strong secret
#   2. ./deploy/init-letsencrypt.sh     # one-time cert bootstrap (HTTP-01)
#   3. docker compose -f docker-compose.prod.yml up -d --build  (--build bakes the console)
#
services:
  app:
    build: .
    env_file:
      - .env
    environment:
      - LEDGER_DIR=/app/data/ledger
      # Synthetic data, zero network. P3-2 hardens the deploy; going live is a
      # separate, deliberate decision — do not flip this to false here.
      - EXCHANGE_DRY_RUN=true
      # Marks the deploy as production → turns on the fail-closed security guard
      # in create_app(): the API refuses to boot unless API_KEYS is set and
      # CORS_ORIGINS is an explicit allowlist.
      - APP_ENV=production
      - CORS_ORIGINS=https://criptotrade.buildtovalue.cloud
      # API_KEYS must come from .env (secret) — the guard rejects an empty value.
    # Trust X-Forwarded-* ONLY from the nginx container (static IP below) so the
    # per-IP rate limiter (RateLimitMiddleware) sees the real client instead of
    # collapsing every request onto nginx's IP. Never use '*' here (spoofable).
    command:
      - uvicorn
      - src.api.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --proxy-headers
      - --forwarded-allow-ips
      - 172.28.0.2
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    networks:
      - edge
    depends_on:
      - prometheus
    restart: unless-stopped

  # Continuous orchestrator loop — separate process, shares the ./data volume.
  orchestrator:
    build: .
    env_file:
      - .env
    environment:
      - LEDGER_DIR=/app/data/ledger
      - EXCHANGE_DRY_RUN=true
      - ORCHESTRATOR_INTERVAL_SECONDS=60
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    command: ["python", "-m", "src.orchestration.main_loop"]
    networks:
      - edge
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    # No host port: internal-only (the dev stack exposed 9090 with no auth).
    # NOTE: app metrics exposition is not yet wired — prometheus-client is a
    # dependency but there is no /metrics ASGI endpoint, so this scrape is
    # currently inert. Kept on the internal network so monitoring lands here
    # once a real exposition endpoint is added (then make it a PUBLIC_PATH or
    # have Prometheus send X-API-Key).
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    networks:
      - edge
    restart: unless-stopped

  nginx:
    # Custom image: stock nginx + the built React console baked in (deploy/console.Dockerfile).
    build:
      context: .
      dockerfile: deploy/console.Dockerfile
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/criptotrade.conf:/etc/nginx/conf.d/default.conf:ro
      - ./data/certbot/conf:/etc/letsencrypt:ro
      - ./data/certbot/www:/var/www/certbot:ro
    networks:
      edge:
        ipv4_address: 172.28.0.2
    depends_on:
      - app
    restart: unless-stopped
    # Reload every 6h so renewed certs are picked up without a manual restart.
    command: "/bin/sh -c 'while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g \"daemon off;\"'"

  certbot:
    image: certbot/certbot
    volumes:
      - ./data/certbot/conf:/etc/letsencrypt
      - ./data/certbot/www:/var/www/certbot
    # Attempt renewal twice a day; certbot only acts within 30 days of expiry.
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    restart: unless-stopped

networks:
  edge:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24

volumes:
  prometheus_data:
