name: Python CI

# Validates the Python trading core and scans for leaked secrets.

on:
  push:
    branches: [master, "claude/**"]
  pull_request:
    branches: [master]

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Ruff (blocking — correctness gate)
        run: ruff check .

      - name: Ruff (full — informational backlog)
        if: always()
        continue-on-error: true
        run: ruff check . --select E,F,B,UP,I --output-format=github

      - name: Pytest (with coverage)
        run: pytest

  docker-build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Python image
        run: docker build -t criptotrade:ci .
