name: Python CI

# Validates the Python trading core and scans for leaked secrets.

on:
  push:
    branches: [master, "claude/**"]
  pull_request:
    branches: [master]

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Ruff (blocking — correctness gate)
        run: ruff check .

      - name: Ruff (full — informational backlog)
        if: always()
        continue-on-error: true
        run: ruff check . --select E,F,B,UP,I --output-format=github

      - name: Pytest (with coverage)
        run: pytest

  docker-build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Python image
        run: docker build -t criptotrade:ci .

      - name: Validate prod compose (nginx/certbot overlay)
        # Catches syntax/reference errors in docker-compose.prod.yml. The throwaway
        # .env just satisfies the env_file reference; real secrets live on the host.
        run: |
          cp .env.prod.example .env
          docker compose -f docker-compose.prod.yml config -q

      - name: Build console image (nginx + baked console)
        run: docker build -f deploy/console.Dockerfile -t criptotrade-console:ci .

      - name: Validate nginx config (throwaway self-signed certs)
        # nginx -t needs the ssl_certificate files to exist; generate ephemeral
        # ones. proxy_pass upstream DNS (app) is resolved at request time, not here.
        run: |
          CERT_DIR=certs/live/criptotrade.buildtovalue.cloud
          mkdir -p "$CERT_DIR"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -keyout "$CERT_DIR/privkey.pem" -out "$CERT_DIR/fullchain.pem" \
            -subj "/CN=criptotrade.buildtovalue.cloud"
          docker run --rm \
            -v "$PWD/deploy/nginx/criptotrade.conf:/etc/nginx/conf.d/default.conf:ro" \
            -v "$PWD/certs:/etc/letsencrypt:ro" \
            nginx:stable nginx -t

  # Production build of the React console (docs/design/pages): pre-transpiles JSX
  # and minifies, replacing the dev-only Babel-in-browser setup. Locks build bitrot.
  console-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs/design/pages
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: docs/design/pages/package-lock.json

      - name: Install (clean)
        run: npm ci

      - name: Build console
        run: npm run build

      - name: Typed client in sync with the OpenAPI schema (P3-4 drift gate)
        # Regenerate the TS types from the committed schema; fail if they differ
        # from what's committed. (The schema-vs-live drift is checked by pytest.)
        run: |
          npm run gen:types
          git diff --exit-code openapi.d.ts

      - name: Upload console dist
        uses: actions/upload-artifact@v4
        with:
          name: console-dist
          path: docs/design/pages/dist
          if-no-files-found: error
