name: Phase 1-3 Validation

# Fast, isolated gate for the API gateway (Phase 1), the HITL order bridge
# (Phase 2) and observability — agents + process log (Phase 3). These suites have
# no heavy deps (no ccxt/langchain/pandas), so this job stays quick. The full test
# suite + docker build run in python-ci.yml.

on:
  push:
    branches: ["claude/**", master]
  pull_request:
    branches: [master]

jobs:
  validate-phases:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install lean deps (Phase 1 & 2)
        run: |
          python -m pip install --upgrade pip
          pip install \
            "fastapi==0.109.0" "uvicorn[standard]==0.27.0" \
            "httpx==0.26.0" "sse-starlette==1.8.2" \
            "pydantic==2.6.0" "pydantic-settings==2.1.0" \
            "pytest==7.4.4" "pytest-asyncio==0.23.3" ruff

      - name: Ruff — new modules (correctness gate)
        run: ruff check src/api src/core/alerts.py src/core/metrics.py src/core/db.py src/hitl src/agents/registry.py tests

      - name: Smoke — API app imports cleanly
        run: python -c "from src.api.main import app; print('API OK:', app.title)"

      - name: Pytest — Phase 1 & 5a (metrics, alerts, API, SQLite backend)
        run: |
          python -m pytest -o addopts="" -v \
            tests/unit/test_metrics.py \
            tests/unit/test_alerts.py \
            tests/unit/test_db.py \
            tests/api/test_api.py

      - name: Pytest — Phase 2 & 3 (HITL bridge, agents, process log)
        run: |
          python -m pytest -o addopts="" -v \
            tests/unit/test_orders.py
