[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
# Allow `import src...` without per-file sys.path hacks.
pythonpath = ["."]
asyncio_mode = "strict"
# Coverage gate: ratchet floor to prevent regression. Actual ~70.7% (roadmap v1);
# raise over time toward the 80% target. Baseline before P3-5 was 65%.
addopts = "-q --cov=src --cov-report=term-missing --cov-fail-under=68"

[tool.coverage.run]
source = ["src"]
branch = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Enforced gate (blocking in CI): ruff's default correctness set
# (pyflakes F + pycodestyle E4/E7/E9). Catches undefined names, unused imports,
# redefinitions, bad except, etc. E501 (line length) is left off to avoid noise.
select = ["E4", "E7", "E9", "F"]
