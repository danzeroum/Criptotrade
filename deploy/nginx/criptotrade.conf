# Reverse proxy + TLS termination for the Criptotrade API.
# Mounted at /etc/nginx/conf.d/default.conf by docker-compose.prod.yml.

# HTTP :80 — serve the ACME HTTP-01 challenge, redirect everything else to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name criptotrade.buildtovalue.cloud;

    # certbot writes the challenge files here (shared webroot volume).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS :443 — terminate TLS and reverse-proxy to the API container.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name criptotrade.buildtovalue.cloud;

    ssl_certificate     /etc/letsencrypt/live/criptotrade.buildtovalue.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/criptotrade.buildtovalue.cloud/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # The real HSTS policy lives at the edge. The app only sends max-age=300
    # (see SecurityHeadersMiddleware); this long-lived header wins for clients.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Static React console (built + minified, baked into the image at
    # /usr/share/nginx/html by deploy/console.Dockerfile).
    root  /usr/share/nginx/html;
    index index.html;

    # Forwarding headers, inherited by every proxy_pass below. uvicorn
    # --proxy-headers reads X-Forwarded-For to restore the real client IP, so the
    # API's per-IP rate limiting works behind the proxy.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Resolve "app" via Docker's embedded DNS at request time. Passing the upstream
    # through a variable stops nginx from resolving it at config-parse/startup time
    # — so `nginx -t` and boot don't fail when app isn't up yet — and lets a
    # restarted app container (new IP) be picked up without an nginx reload.
    resolver 127.0.0.11 valid=30s;
    set $app_upstream app:8000;

    # API surface → app container. Every router is mounted under /v1 (including
    # /v1/docs, /v1/openapi.json); /health is the only root-level API endpoint.
    location /v1/ {
        proxy_pass http://$app_upstream;
    }
    location = /health {
        proxy_pass http://$app_upstream;
    }

    # Everything else is the console. It uses hash routing, so the path is always
    # "/" server-side; the fallback just future-proofs any real client route.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
