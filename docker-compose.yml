# Dev stack — everything in Docker. Start with: `docker compose up -d`
#   app          API (FastAPI)         http://localhost:8000  (/metrics, /health/ready)
#   dashboard    Streamlit console     http://localhost:8501
#   orchestrator continuous loop       (no port; shares ./data)
#   prometheus   metrics scraper       http://localhost:9090
# Scale-out (shared rate limit across API replicas):
#   REDIS_URL=redis://redis:6379/0 docker compose --profile scale up -d
services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Persist the append-only ledger/alerts on the mounted ./data volume so
      # portfolio metrics survive container restarts.
      - LEDGER_DIR=/app/data/ledger
      # Synthetic market data, zero network. Never set =false in a versioned file:
      # real trading must be an explicit, deliberate override in the deploy env.
      - EXCHANGE_DRY_RUN=true
      # To scale the API horizontally, set REDIS_URL (e.g. redis://redis:6379/0)
      # in .env and bring up the 'scale' profile so the rate limiter is shared.
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/ready"]
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 3
    depends_on:
      prometheus:
        condition: service_started
    restart: unless-stopped

  # Continuous orchestrator loop — a SEPARATE process from the API (Option A).
  # Shares the ./data volume so the loop's ledger/events are the same files the
  # API reads. Single instance by design (see docs/adr/005-scaling-path.md).
  orchestrator:
    build: .
    env_file:
      - .env
    environment:
      - LEDGER_DIR=/app/data/ledger
      - EXCHANGE_DRY_RUN=true
      - ORCHESTRATOR_INTERVAL_SECONDS=60
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    command: ["python", "-m", "src.orchestration.main_loop"]
    healthcheck:
      test: ["CMD", "python", "scripts/healthcheck_loop.py"]
      interval: 60s
      timeout: 10s
      start_period: 90s
      retries: 3
    restart: unless-stopped

  # Streamlit operational console (consumes the API over HTTP).
  dashboard:
    build: .
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      - API_URL=http://app:8000
    command:
      - streamlit
      - run
      - src/dashboard/app.py
      - --server.port=8501
      - --server.address=0.0.0.0
      - --server.headless=true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # Dashboards over the Prometheus metrics (datasource + dashboard auto-provisioned).
  # http://localhost:3000 (admin / GF_SECURITY_ADMIN_PASSWORD, default 'admin').
  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards
      - grafana_data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # Shared state backend for horizontal scale (multiple hosts/replicas writing
  # state). OFF by default; enable with the 'scale' profile and point the app at
  # it: DATABASE_URL=postgresql://ct:ct@postgres:5432/criptotrade (see ADR-005).
  postgres:
    image: postgres:16-alpine
    profiles: ["scale"]
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-ct}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-ct}
      - POSTGRES_DB=${POSTGRES_DB:-criptotrade}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ct} -d ${POSTGRES_DB:-criptotrade}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Shared rate-limit / cache backend for horizontal API scaling. OFF by default;
  # enable with the 'scale' profile + REDIS_URL (see header). The API fails open
  # to in-memory if Redis is unset or unreachable.
  redis:
    image: redis:7-alpine
    profiles: ["scale"]
    ports:
      - "6379:6379"
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  prometheus_data:
  grafana_data:
  postgres_data:
