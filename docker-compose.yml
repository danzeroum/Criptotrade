version: '3.8'

services:
  app:
    build: .
    ports:
      - "8000:8000"
      - "8501:8501"
    env_file:
      - .env
    environment:
      # Persist the append-only ledger/alerts on the mounted ./data volume so
      # portfolio metrics survive container restarts.
      - LEDGER_DIR=/app/data/ledger
      # Synthetic market data, zero network. Never set =false in a versioned file:
      # real trading must be an explicit, deliberate override in the deploy env.
      - EXCHANGE_DRY_RUN=true
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    depends_on:
      - prometheus
    restart: unless-stopped

  # Continuous orchestrator loop — a SEPARATE process from the API (Option A).
  # Shares the ./data volume so the loop's XES events/ledger are the same files
  # the API reads. NOTE (ADR-001): this makes two processes append to the JSONL
  # ledger — the documented trigger toward SQLite/PostgreSQL. Tolerable for
  # dry-run dev (POSIX appends are atomic under PIPE_BUF); revisit before live.
  orchestrator:
    build: .
    env_file:
      - .env
    environment:
      - LEDGER_DIR=/app/data/ledger
      - EXCHANGE_DRY_RUN=true
      - ORCHESTRATOR_INTERVAL_SECONDS=60
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    command: ["python", "-m", "src.orchestration.main_loop"]
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    restart: unless-stopped

volumes:
  prometheus_data:
